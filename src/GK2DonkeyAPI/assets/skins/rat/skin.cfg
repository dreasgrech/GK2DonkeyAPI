# A built-in skin of GK2 Donkey API (docs/skins-design.md). Drawn by tools/skins/creatures/make_creatures.py: our own art.
[Skin]
format = 1
id = rat
name = Giant Rat
author = dreas
version = 1.0
base = donkey
kind = own
layer = replace
canvas = 96 96
seat = 46  # the rider's hip on this row of the picture, every frame, for every player (docs/seat-investigation.md)
mount = rat

# The skin's colours by mount region (docs/mount-colours.md); every colour not named is Coat.
[Colors]
Dark = 221A20
Muzzle = 844A56 A66870 60323E
Eye = 460A10 EC5C46 B21A1E

# The mount this skin is the Default of (docs/mounts-design.md): what the player rides, shared by every skin of it.
[Mount]
id = rat
name = Giant Rat
author = dreas
version = 1.0
cart = true
foals = true

# With the cart only: the whole cart 9 px further behind the longer body.
[Mount.Tuning.Cart]
HitchGapPx = 9
