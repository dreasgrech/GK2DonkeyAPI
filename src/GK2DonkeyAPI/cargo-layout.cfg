# GK2 Donkey API cargo layout: corrections on top of the size-based cargo packer (see CargoLayout.cs).
# Embedded into the DLL at build time. The tuning panel writes this file as you edit; rebuild to ship it.
# [item <id>] applies to every item of the same size class (measured box within 0.05).
#   along / up / across: at the bottom or beside another item (and alone, without alone_*); top_along / top_up / top_across: stacked on top.
#   alone_along / alone_up / alone_across: the only item on the cart (all three written when set, zeros included).
# [pair <a>+<b>] applies to that pair of size classes in either order. Two relations, each tunable on its own:
#   beside_a_* / beside_b_*: the two lying beside each other (side or along), the exact place of a and b (along, height above the layer's floor, across);
#   top_a_* / top_b_*: b on top of a, both places as a two-item cart shows them; inside a bigger load b is placed relative to a.
#   mode = auto | side (across the bed) | along (end to end) | stack: which relation a two-item cart shows. A tuned relation is frozen against everything but the floor.
# Exact ids win over size-class matches; among class matches the first in this file wins.
#
# Size classes at the time of writing (27 items): log (wood); flour sack (box_flour); tall crate (box_beer,
# box_clothes_1/2, box_fabric, box_vine); body (body_corpse, body_wild_zombie); low crate (15 box_* incl. preserves);
# slab (stone, iron_ore_2h); no mesh (marble -> shown with the slab mesh, box_engineering_mechanism -> generic crate);
# zombie (body_zombie: the game's lying zombie, one body for all ten heads; a class of its own, matched by id only);
# chest (chest_rough / chest / chest_good riding on the cart, CartChest.cs: a class each, matched by id only; alone_* places it).
version = 2

[item body_corpse]
up = 0.03
across = 0.03
alone_along = 0
alone_up = -0.02
alone_across = 0

[item box_flour]
along = 0.01
top_up = -0.22

[item box_vine]
along = 0.19
alone_along = 0
alone_up = 0
alone_across = 0

[item stone]
top_up = -0.14
alone_along = 0
alone_up = -0.13
alone_across = -0.02

[item wood]
along = -0.02
up = -0.09
across = 0.05
alone_along = -0.02
alone_up = -0.2
alone_across = -0.03

[item body_zombie]
alone_along = 0.04
alone_up = 0.02
alone_across = 0.02

[item chest_rough]
alone_along = 0
alone_up = -0.01
alone_across = 0.04

[pair wood+wood]
mode = side
beside_a_along = -0.02
beside_a_up = -0.03
beside_a_across = 0.18
beside_b_along = 0
beside_b_up = -0.19
beside_b_across = -0.12
top_a_along = -0.02
top_a_up = -0.18
top_a_across = -0.08
top_b_along = 0.02
top_b_up = 0.08
top_b_across = -0.18

[pair body_corpse+wood]
mode = side
beside_a_along = 0
beside_a_up = 0.11
beside_a_across = 0.13
beside_b_along = -0.02
beside_b_up = -0.09
beside_b_across = -0.13
top_a_along = 0
top_a_up = 0.03
top_a_across = 0.03
top_b_along = 0.02
top_b_up = 0.29
top_b_across = -0.13

[pair wood+stone]
mode = stack

[pair wood+box_vine]
mode = along

[pair wood+box_flour]
mode = stack

[pair body_corpse+iron_ore_2h]
mode = stack

[pair iron_ore_2h+box_beer]
mode = stack

[pair body_corpse+box_flour]
mode = stack
top_a_along = 0
top_a_up = -0.01
top_a_across = 0.03
top_b_along = 0
top_b_up = 0.19
top_b_across = 0.04

[pair body_corpse+body_corpse]
mode = stack
top_a_along = 0
top_a_up = 0.02
top_a_across = 0.03
top_b_along = 0
top_b_up = 0.24
top_b_across = 0.03

[pair box_appliances_1+box_appliances_1]
mode = along
beside_a_along = 0.26
beside_a_up = 0
beside_a_across = 0
beside_b_along = -0.23
beside_b_up = 0
beside_b_across = 0

[pair box_appliances_1+box_beer]
mode = along
beside_a_along = 0.33
beside_a_up = 0
beside_a_across = 0
beside_b_along = -0.17
beside_b_up = 0
beside_b_across = 0

[pair body_zombie+body_zombie]
mode = stack
top_a_along = 0.01
top_a_up = -0.02
top_a_across = 0
top_b_along = 0.07
top_b_up = 0.25
top_b_across = 0

[pair body_zombie+wood]
mode = side
beside_a_along = 0
beside_a_up = -0.04
beside_a_across = 0.08
beside_b_along = -0.02
beside_b_up = -0.08
beside_b_across = -0.11

[pair body_zombie+body_corpse]
mode = stack
