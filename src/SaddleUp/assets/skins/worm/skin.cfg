# A built-in skin of GK2 Donkey API (docs/skins-design.md). Drawn by tools/skins/creatures/make_creatures.py: our own art.
# No hitch gap: the cart's shafts reach 16 px past the worm's rear edge against 30 on the donkey (the cart readout,
# 2026-10-20), so its cart already stands further from the body than the donkey's.
[Skin]
format = 1
id = worm
name = Giant Worm
description = The Giant Worm, pink and plain.
author = dreas
version = 1.0
base = donkey
kind = own
layer = replace
canvas = 96 96
seat = 52  # the rider's hip on this row of the picture, every frame, for every player (docs/seat-investigation.md)
mount = worm

# The skin's colours by mount region (docs/mount-colours.md); every colour not named is Coat.
[Colors]
Dark = 36141C 18080C 3C121A

# The mount this skin is the Default of (docs/mounts-design.md): what the player rides, shared by every skin of it.
[Mount]
id = worm
name = Giant Worm
description = A giant worm: it pulls the cart, has young and makes no sound; nothing on it takes a harness or a second tone.
author = dreas
version = 1.0
cart = true
foals = true

# A worm makes no donkey sounds: its bray, hoofsteps and the lip smack are off (every sound key is a mount's to set).
[Mount.Tuning]
BrayVolume = 0
HoofVolume = 0
LipsVolume = 0
