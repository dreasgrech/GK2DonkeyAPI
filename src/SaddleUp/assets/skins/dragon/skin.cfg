# A built-in skin of GK2 Donkey API (docs/skins-design.md). Drawn by tools/skins/creatures/make_creatures.py: our own art.
[Skin]
format = 1
id = dragon
name = Red Dragon
description = The Red Dragon: red scales, a spiked tail, the near wing drawn in front of the rider, a golden belly of its own tone.
author = dreas
version = 1.0
base = donkey
colours = own
layer = replace
canvas = 128 128
seat = 62  # the rider's hip on this row (the donkey's 52, plus the 16 px the 128 canvas adds, minus the 6 px the body stands higher on its longer legs since 2026-10-23), every frame, for every player
mount = dragon

# With the cart only: the whole cart 24 px further behind the long body and tail (the skin owns its drawing's geometry).
[Tuning.Cart]
HitchGapPx = 24

# The skin's colours by mount region (docs/mount-colours.md); every colour not named is Coat.
[Colors]
Dark = 1C060C 260828 2E0C14 52402E 280810 928062 D4C6A8 1E0A0A
Muzzle = A86A28 703E1A DAA042
Eye = FAD640 F4CE76

# The mount this skin is the Default of (docs/mounts-design.md): what the player rides, shared by every skin of it.
[Mount]
id = dragon
name = Dragon
description = A dragon of the keeper's own, drawn 128 pixels tall: it pulls the cart and has young; its belly takes the second tone.
author = dreas
version = 1.0
cart = true
foals = true
flies = true
speed = 1.6  # times the keeper's walking speed, riding (the donkey: 2)
cargo = 6  # items its cart carries, 1 to 6 (every mount the most for now)
