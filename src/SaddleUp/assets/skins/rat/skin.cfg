# A built-in skin of GK2 Donkey API (docs/skins-design.md). Drawn by tools/skins/creatures/make_creatures.py: our own art.
[Skin]
format = 1
id = rat
name = Giant Rat
description = The Giant Rat, grey with a pink tail, ears and nose.
author = dreas
version = 1.0
base = donkey
colours = own
layer = replace
canvas = 96 96
seat = 52  # the rider's hip on this row of the picture, every frame, for every player (docs/seat-investigation.md)
mount = rat

# With the cart only: the whole cart 9 px further behind the longer body (the skin owns its drawing's geometry).
[Tuning.Cart]
HitchGapPx = 9

# The skin's colours by mount region (docs/mount-colours.md); every colour not named is Coat.
[Colors]
Dark = 221A20
Muzzle = 844A56 A66870 60323E
Eye = 460A10 EC5C46 B21A1E

# The mount this skin is the Default of (docs/mounts-design.md): what the player rides, shared by every skin of it.
[Mount]
id = rat
name = Giant Rat
description = A rat the size of a donkey: it pulls the cart and has young; its tail, ears and nose take the second tone.
author = dreas
version = 1.0
cart = true
foals = true
speed = 2.75  # times the keeper's walking speed, riding (the donkey: 2)
cargo = 6  # items its cart carries, 1 to 6 (every mount the most for now)

# First picks from the game's own sounds, to audition on the Mounts tab (docs/mount-sounds.md): the game has no rat,
# so a squeal is the spitter's cry pitched up; quick light feet; nibbling. A real squeak wants a file of our own.
[Mount.Sounds]
voice = spitter_attack  # pitched up: a squeal
voice.pitch = 1.5
voice.volume = 0.6
voice.idle_every = 30
step = ground  # the ground's own step sound, high and light, six quick feet a cycle
step.pitch = 1.4
step.volume = 0.7
step.per_cycle = 6
graze = item_use_food  # nibbling
graze.volume = 0.8
lips = none
