# A built-in skin of GK2 Donkey API (docs/skins-design.md). Drawn by tools/skins/creatures/make_creatures.py: our own art.
[Skin]
format = 1
id = rat
name = Giant Rat
description = The Giant Rat, grey with a pink tail, ears and nose.
author = dreas
version = 1.0
base = donkey
colours = own
layer = replace
canvas = 96 96
seat = 52  # the rider's hip on this row of the picture, every frame, for every player (docs/seat-investigation.md)
mount = rat

# With the cart only: the whole cart 9 px further behind the longer body (the skin owns its drawing's geometry).
[Tuning.Cart]
HitchGapPx = 9

# The skin's colours by mount region (docs/mount-colours.md); every colour not named is Coat.
[Colors]
Dark = 221A20
Muzzle = 844A56 A66870 60323E
Eye = 460A10 EC5C46 B21A1E

# The mount this skin is the Default of (docs/mounts-design.md): what the player rides, shared by every skin of it.
[Mount]
id = rat
name = Giant Rat
description = A rat the size of a donkey: it pulls the cart and has young; its tail, ears and nose take the second tone.
author = dreas
version = 1.0
cart = true
foals = true
