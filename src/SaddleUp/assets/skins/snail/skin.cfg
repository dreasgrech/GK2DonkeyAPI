Muzzle = 522816 804828 462618 3C2014 60361E B07848 A0602B A5642D 965832 7F4620 995B29 B57133 8F5225 78401E 905326 844A22 7C431F 7A421E 9F602B 864B22 7E4520 884D23 A4713F A06C3B 9B6637 A6703B B37940 945F33 996335 A26A38 B1773D B87C3F B97D3F 925C30 A66C36 B67A3C BA7B3E BB7E3E BD7E3E 8A542B 90582D A16533 A66A35 B97A3B BD7C3C BF7F3D C1803E 865027 8D542A 995E2E 9F6330 A56832 834B24 8A5126 975B2B 9D602E A46530 BD7A38 C37E3A C7823C 945727 9A5D2A A1622C B67234 BD7836 C37E38 CA833B D0883D 8B4F24 925526 BC7735 C37D37 D0873C 8A4E24 915426 985A29 9F5F2B B37032 BA7534 C07A36 C98139 965828 9C5D2A BA7634 B06D31 8C5025 935527 AB692F 955727 A9682E AD6A30 AF6D30 B16E31 894D23 A2622C A7662E A8672E 8A4F24 854A22 945627 975928 824821 8F5326 894E23 8C5024 AF7840 7F4520 A36F3C AA723D AE753D B0773E B67C40 B57C40 B47A40 A36C3A 9F6938 A66E39 AA713B AE743B B67A3E B4793E 9D6736 A16835 AA7038 AF733A B3763B 976032 9B6131 AB6F36 B5763A 965D2F AB6D34 B67638 BB7A3A BF7E3B C3813D AA6B31 B67536 CB853D 864B23 A8682F AE6C30 CA823A 7D441F C57E38 A3632C BE7936 C17B36 B77333 B47032 9A5C29 955728 9A5B29 9E5F2B 7A411E 804620 9B5C2A 9D5E2A 935627 905426 8D5125 79411E 8E5225 AA733E AD7640 B17941 B37B42 B47B42 A7713E 874C23 7B421F

# The mount this skin is the Default of (docs/mounts-design.md): what the player rides, shared by every skin of it.
[Mount]
id = snail
name = Giant Snail
description = A giant snail: it pulls the cart, has young and makes no sound; its shell takes the second tone.
author = dreas
version = 1.0
cart = true
foals = true
speed = 1.25  # times the keeper's walking speed, riding (the donkey: 2)
cart_speed = 1  # driving the cart (the donkey: 1.5)

# A snail makes no donkey sounds: its bray, hoofsteps and the lip smack are off (every sound key is a mount's to set;
# docs/reference.md "Sounds").
[Mount.Tuning]
BrayVolume = 0
HoofVolume = 0
LipsVolume = 0
