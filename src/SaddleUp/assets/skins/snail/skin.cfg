# A built-in skin of GK2 Donkey API (docs/skins-design.md). Drawn by tools/skins/creatures/make_creatures.py: our own art.
# No hitch gap: the cart's shafts reach 15 px past the snail's rear edge against 30 on the donkey (the cart readout,
# 2026-10-20), so its cart already stands further from the body than the donkey's.
[Skin]
format = 1
id = snail
name = Giant Snail
description = The Giant Snail, a slow-looking body under a spiral shell of its own tone.
author = dreas
version = 1.0
base = donkey
colours = own
layer = replace
canvas = 96 96
seat = 55  # the rider's hip on this row: 3 px lower on the shell than on the donkey (docs/seat-investigation.md)
mount = snail

# Riding only: the rider 6 px further back on the shell (its height is the seat row above). The skin owns its
# drawing's geometry; the mount block below keeps what the creature is.
[Tuning.Ride]
RiderOffsetPx = -6

# The skin's colours by mount region (docs/mount-colours.md); every colour not named is Coat.
[Colors]
