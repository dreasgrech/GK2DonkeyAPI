# A mount of GK2 Saddle Up (docs/making-a-mount.md): what the player rides, shared by every skin in skins\.
# The [Mount] facts, its [Stats], its [Tuning] and its [Sounds] (files in sounds\, docs/mount-sounds.md).
[Mount]
id = saddleup.gerry
name = Gerry
noun = skull
description = The talking skull finally makes himself useful. He hops along on pure opinion, and he has plenty of it to share on the way.
author = dreas
version = 1.0
cart = true
foals = true
foal_scale = 0.33  # the skull is drawn 3x the game's: its babies at a third are the game's size
speed = 2.25  # times the keeper's walking speed, riding (the donkey: 2)
cargo = 4  # items its cart carries, 1 to 6 (the player's Cart capacity, when smaller, wins)

# Gerry's own sounds (docs/mount-sounds.md): his dialogue voice (the game's "garry" clips), a skull's bone steps, no
# grazing and no lip smack (the donkey's own sounds never reach another mount; these lines say so in the file).
[Sounds]
voice = garry  # Gerry's own voice: bear, err, eww, urr
voice.volume = 2.25  # matched to the game's own sounds (the donkey's bray; GK2-mount-sounds\loudness.txt, 2026-10-25): his lines are 7 dB under it
voice.channel = speech
voice.idle_every = 40
step = larry_steps  # bone steps (Larry the skull's), one a hop
step.per_cycle = 2
graze = none
lips = none
