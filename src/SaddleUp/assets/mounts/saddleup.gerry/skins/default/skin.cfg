# A skin of GK2 Saddle Up's gerry mount (docs/gerry-mount.md): Gerry, the game's talking skull, as a mount. No pictures
# of its own: the game's 0901_ frames are read back at run time and scaled (docs/skins.md, source = game). No [Colors]
# section: every colour is Coat until tools/skins/skin_colors.py writes the sockets as Dark from the game's export of his
# frames (BepInEx\GK2-asset-probe\game-skins\gerry, the Mounts tab's "Export the loaded skins as built").
# No hitch gap: the cart's shafts reach 6 px past the skull's rear edge against 30 on the donkey (the cart readout,
# 2026-10-20): the cart stands well clear of him.
[Skin]
format = 1
name = Gerry
description = Gerry as you know him, only three times bigger. He insists he was always this size.
author = dreas
version = 1.0
base = donkey
colours = own
layer = replace
canvas = 160 160
source = game
seat = picture  # the rider sits on the skull's top, this frame's, and rides its hop

[Game]
prefix = 0901_
scale = 3
lift = 0.25           # a quarter of his own hop: a mount under a rider hops a little
# base key = the game's frame (without the prefix); keys not listed follow the rules in docs/skins.md
bdy_static_left = bdy_walk_left_01
bdy_turn_left_01 = bdy_somersault_left_01
bdy_turn_left_02 = bdy_somersault_left_04
bdy_turn_left_03 = bdy_somersault_left_07
bdy_turn_left_04 = bdy_somersault_left_10
bdy_turn_left_05 = bdy_somersault_left_13
bdy_turn_left_06 = bdy_somersault_left_16
bdy_chew_left_01 = hed_speak_left_01
bdy_chew_left_02 = hed_speak_left_02
bdy_chew_left_03 = hed_speak_left_03
bdy_lips_left_01 = hed_speak_left_01
bdy_lips_left_02 = hed_speak_left_02
bdy_lips_left_03 = hed_speak_left_03
bdy_lips_left_04 = hed_speak_left_02
bdy_lips_left_05 = hed_speak_left_01
bdy_lips_left_06 = hed_speak_left_02
bdy_lips_left_07 = hed_speak_left_03
bdy_lips_left_08 = hed_speak_left_02
bdy_lips_left_09 = hed_speak_left_01
bdy_lips_left_10 = hed_speak_left_02
bdy_lips_left_11 = hed_speak_left_03
bdy_lips_left_12 = hed_speak_left_02
bdy_lips_left_13 = hed_speak_left_01
bdy_graze_left_01 = bdy_walk_left_01
bdy_graze_left_02 = bdy_walk_left_02
bdy_graze_left_03 = bdy_walk_left_03
bdy_graze_left_04 = bdy_walk_left_02
bdy_graze_left_05 = bdy_walk_left_01

# The rider on the skull (seat = picture: from this frame's top row), 16 px down into it, riding and with the cart alike.
[Tuning]
SeatAdjustPx = -16
