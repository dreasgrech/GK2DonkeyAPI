# A skin of GK2 Saddle Up's rat mount (docs/skins.md): its look, the mount's own values in ..\..\mount.cfg. Drawn by tools/skins/creatures/make_creatures.py: our own art.
[Skin]
format = 1
id = grey-rat
name = Giant Rat
description = The Giant Rat, grey with a pink tail, ears and nose.
author = dreas
version = 1.0
base = donkey
colours = own
layer = replace
canvas = 96 96
seat = 52  # the rider's hip on this row of the picture, every frame, for every player (docs/seat-investigation.md)

# With the cart only: the whole cart 9 px further behind the longer body (the skin owns its drawing's geometry).
[Tuning.Cart]
HitchGapPx = 9

# The skin's colours by mount region (docs/mount-colours.md); every colour not named is Coat.
