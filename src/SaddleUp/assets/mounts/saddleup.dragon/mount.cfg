# A mount of GK2 Saddle Up (docs/making-a-mount.md): what the player rides, shared by every skin in skins\.
# The [Mount] facts, its [Stats], its [Tuning] and its [Sounds] (files in sounds\, docs/mount-sounds.md).
[Mount]
id = saddleup.dragon
name = Dragon
description = A dragon of the keeper's own, drawn 128 pixels tall: it has young and pulls no cart; its belly takes the second tone.
author = dreas
version = 1.0
cart = false  # no cart behind a dragon (the user, 2026-10-25): it is ridden plain
foals = true
flies = true
speed = 1.6  # times the keeper's walking speed, riding (the donkey: 2)

# The dragon's own sounds (docs/mount-sounds.md; files in sounds\, trimmed and levelled): the user's growls for its
# roar, getting on and off and its babies (pitched up), take-off, landing, flaps, glide and the landing thud; heavy
# stone steps and a bellows breath at the grass from the game's own.
[Sounds]
voice = voice_1.ogg, voice_2.ogg, voice_3.ogg  # the user's growls (2026-10-25), in place of the zombie's cry pitched down
voice.idle_every = 60
mount = voice_1.ogg  # the shortest growl as the keeper gets on
mount.volume = 0.6
dismount = voice_1.ogg
dismount.volume = 0.5
takeoff = takeoff_1.ogg, takeoff_2.ogg, takeoff_3.ogg, takeoff_4.ogg  # the user's lift-off sounds (2026-10-24), trimmed and levelled
land = land_1.ogg, land_2.ogg  # the user's landing sounds: from the start of the dive, about two seconds to the ground
touchdown = touchdown_1.ogg  # the user's landing thud (2026-10-25), on touching the ground
flap = flap_1.ogg, flap_2.ogg, flap_3.ogg, flap_4.ogg, flap_5.ogg  # the user's flapping, cut into single wing beats (one a beat, 0.6 s)
flap.volume = 0.6
glide = glide_1.ogg, land_2.ogg  # the user's glide sounds (the second is also a landing); cut when the glide ends
step = step_stone  # heavy feet: the stone step, low and loud, one on each paw's landing (frames 1, 3, 5, 7)
step.pitch = 0.7
step.volume = 1.6
step.per_cycle = 4
graze = conveyor_furnace_bellows  # a breath at the grass
graze.volume = 0.8
lips = none

# The babies answer their parent's roar with the same growls, pitched up and softer: a whelp's.
[Sounds.Baby]
answer = voice_1.ogg, voice_2.ogg
answer.pitch = 1.6
answer.volume = 0.6
