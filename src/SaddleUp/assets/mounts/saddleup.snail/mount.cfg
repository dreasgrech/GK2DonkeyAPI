# A mount of GK2 Saddle Up (docs/making-a-mount.md): what the player rides, shared by every skin in skins\.
# The [Mount] facts, its [Stats], its [Tuning] and its [Sounds] (files in sounds\, docs/mount-sounds.md).
[Mount]
id = saddleup.snail
name = Giant Snail
description = A giant snail: it pulls the cart, has young and makes no sound; its shell takes the second tone.
author = dreas
version = 1.0
cart = true
foals = true
speed = 1.25  # times the keeper's walking speed, riding (the donkey: 2)
cargo = 6  # items its cart carries, 1 to 6 (every mount the most for now)

# The snail's own sounds (docs/mount-sounds.md): silent but for a wet blop when the keeper gets on and off (the
# donkey's own sounds never reach another mount; these lines say so in the file).
[Sounds]
voice = none
step = none
graze = none
lips = none
mount = fishing_blop  # wet
dismount = fishing_blop
