# Jester: a skin drawn over the donkey (docs/skins.md). Our own art, drawn once in tools/skins/jester/, placed by tools/skins/stamp.py.
[Skin]
format = 1
name = Jester
description = A fool's cap with two belled points, a belled collar round the neck and a quartered motley caparison with a pointed hem. The burgundy follows your harness colour, the navy your second tone.
author = dreas
version = 0.3
base = donkey
colours = own
layer = over
erase = FF00FF  # over only: pixels of this colour clear the donkey there (the ears under horns)
canvas = 96 96

# The skin's colours by mount region (docs/mount-colours.md); every colour not named is kept as drawn (an over skin, docs/skins.md).
[Colors]
Harness = C2485A A23444 862534 641A28 3A0A14   # the motley's burgundy: the player's harness colour
Muzzle = 6E86C8 4E66A8 34488A 243266 141A3A    # the motley's navy: the Second tone row; the gold of the cap's band and the bells is drawn as it is

# The donkey's own harness strap under the skin, its leather turned to the motley's colour (it showed between the
# collar, the cap and the cloth in the turn and the graze: the second design's last review); the player's
# harness colour still reaches it on top (docs/skins.md "Recolouring the donkey under the skin").
[Base.Harness]
Colorize = 862534
ColorizeAmount = 0.85
