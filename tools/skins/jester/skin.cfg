# Jester: a skin drawn over the donkey (docs/skins.md). Our own art, drawn once in tools/skins/jester/, placed by tools/skins/stamp.py.
[Skin]
format = 1
name = Jester
description = A fool's cap with two belled points, a belled collar round the neck and a quartered motley caparison with a pointed hem. Every part of the motley is yours to colour: the cap's two halves, the collar and its points, the caparison's quarters.
author = dreas
version = 0.4
base = donkey
colours = own
layer = over
erase = FF00FF  # over only: pixels of this colour clear the donkey there (the ears under horns)
canvas = 96 96

# Every part of the motley a tone of its own, with its row in the colours window (docs/mount-colours.md section 7):
# the cap's two halves, the collar's band and its points, the caparison's quarters. To the eye they are one burgundy
# and one navy; each part's shades sit in colour-cube cells of their own (tools/skins/part_palette.py, draw_jester.py),
# a colour being one tone's only. The Harness row reaches the donkey's strap only, the Second tone row its muzzle; the
# gold of the cap's band and the bells is drawn as it is.
[Tone.cap-front]
name = Cap, front half
colours = C14859 A03444 862633 641A2A 3E0A14   # burgundy: the front point and its half of the hood

[Tone.cap-back]
name = Cap, back half
colours = 7086C8 4F66A7 36488A 263266 131A39   # navy: the back point and its half

[Tone.collar]
name = Collar
colours = C1485B A23644 882534 671A28 3A0D14   # burgundy: the band and the middle point

[Tone.collar-points]
name = Collar points
colours = 4D67A8 34488C 243262 151A39   # navy: the two outer points

[Tone.caparison]
name = Caparison
colours = C2485A A23444 862534 641A28 3A0A14   # burgundy: two of its quarters

[Tone.caparison-second]
name = Caparison, second colour
colours = 6E86C8 4E66A8 34488A 243266 141A3A   # navy: the other two

# The donkey's own harness strap under the skin, its leather turned to the motley's colour (it showed between the
# collar, the cap and the cloth in the turn and the graze: the second design's last review); the player's
# harness colour still reaches it on top (docs/skins.md "Recolouring the donkey under the skin").
[Base.Harness]
Colorize = 862534
ColorizeAmount = 0.85
