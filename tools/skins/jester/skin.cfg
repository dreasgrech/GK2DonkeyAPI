# Jester: a skin drawn over the donkey (docs/skins.md). Our own art, drawn once in tools/skins/jester/, placed by tools/skins/stamp.py.
[Skin]
format = 1
name = Jester
description = A fool's cap with two belled points, a belled collar round the neck and a chequered motley caparison with a pointed hem. Every part is yours to colour: the cap's two halves and its band, the harness and the collar's points, the caparison's checks and the bells.
author = dreas
version = 0.4
base = donkey
colours = own
layer = over
erase = FF00FF  # over only: pixels of this colour clear the donkey there (the ears under horns)
canvas = 96 96

# Every part of the motley a tone of its own, with its row in the colours window (docs/mount-colours.md section 7):
# the cap's two halves, the collar's points, the caparison's checks. To the eye they are one burgundy
# and one navy; each part's shades sit in colour-cube cells of their own (tools/skins/part_palette.py, draw_jester.py),
# a colour being one tone's only. The Second tone row reaches the donkey's muzzle only. The
# gold of the cap's band and of the bells, two parts too since the same day (the user: "every part is named and is
# able to be coloured"), the band's shades a step off the bells'.
#
# The harness is the Jester's own (2026-11-08): the collar band, crest to chest, its point and bell at the end; the
# donkey's own strap is hidden in every frame (draw_jester.py strap_hidden: drawn over as the neck and chest), so
# the Harness row colours the Jester's and none of the donkey's own harness shows ("the original harness
# underneath ... should be invisible since we're using our own custom harness", the user).
# Before, the collar was a part of its own and the Harness row reached the donkey's strap under it.
[Colors]
Harness = C1485B A23644 882534 671A28   # burgundy: the collar band, crest to chest (its edge the donkey's outline colour)

[Tone.cap-front]
name = Cap, front half
colours = C14859 A03444 862633 641A2A 3E0A14   # burgundy: the front point and its half of the hood

[Tone.cap-back]
name = Cap, back half
colours = 7086C8 4F66A7 36488A 263266 131A39   # navy: the back point and its half

[Tone.cap-band]
name = Cap band
colours = FED653 E3A82F 996414   # gold: the band round the cap

[Tone.collar-points]
name = Collar points
colours = A23441 882633 671A2A 3A0A10   # burgundy: the front view's middle point (the side view's is the harness's own end)

[Tone.collar-points-second]
name = Collar points, second colour
colours = 4D67A8 34488C 243262 151A39   # navy: the front view's outer two

[Tone.caparison]
name = Caparison
colours = C2485A A23444 862534 641A28 3A0A14   # burgundy: two of its quarters

[Tone.caparison-second]
name = Caparison, second colour
colours = 6E86C8 4E66A8 34488A 243266 141A3A   # navy: the other two

[Tone.bells]
name = Bells
colours = FFD652 E2A830 966414 5A3A0A   # gold: every bell, the cap's, the collar's and the hem's

# The donkey's dark parts under the skin: its legs and mane, its ears cleared under the hood (docs/second-tone.md 8).
[Region.Dark]
name = Legs and mane

# The donkey's own harness strap under the skin, its leather turned to the harness's burgundy: all of it is drawn
# over (above), this only for a pixel a frame might leave; the player's harness colour reaches it on top too
# (docs/skins.md "Recolouring the donkey under the skin").
[Base.Harness]
Colorize = 862534
ColorizeAmount = 0.85
