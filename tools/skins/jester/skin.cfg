# Jester: a skin drawn over the donkey (docs/skins.md). Our own art, drawn once in tools/skins/jester/, placed by tools/skins/stamp.py.
[Skin]
format = 1
name = Jester
description = A fool's cap with two belled points, a belled collar round the neck and a quartered motley caparison with a pointed hem. Both colours of the motley are yours to choose.
author = dreas
version = 0.3
base = donkey
colours = own
layer = over
erase = FF00FF  # over only: pixels of this colour clear the donkey there (the ears under horns)
canvas = 96 96

# The motley's two colours, each a tone of the skin's own with its row in the colours window (docs/mount-colours.md
# section 7): the cap's points and the cloth's quarters share them, so each row colours both. The Harness row reaches
# the donkey's strap only, the Second tone row its muzzle; the gold of the cap's band and the bells is drawn as it is.
[Tone.motley1]
name = First motley colour
colours = C2485A A23444 862534 641A28 3A0A14   # the burgundy

[Tone.motley2]
name = Second motley colour
colours = 6E86C8 4E66A8 34488A 243266 141A3A   # the navy

# The donkey's own harness strap under the skin, its leather turned to the motley's colour (it showed between the
# collar, the cap and the cloth in the turn and the graze: the second design's last review); the player's
# harness colour still reaches it on top (docs/skins.md "Recolouring the donkey under the skin").
[Base.Harness]
Colorize = 862534
ColorizeAmount = 0.85
