# Default value: 4
# Acceptable value range: From -60 to 60
LanternTilt = 4

## Cart style only: lean the pole about its foot towards the camera (positive) or away from it, degrees. The lamp follows the top; its sprites stay upright.
# Setting type: Single
# Default value: 0
# Acceptable value range: From -60 to 60
LanternLean = 0

## Cart style only: the iron lamp hangs straight down from the pole's hook (with its lit glass, glow and lights) while the pole tips with a slope, rocks while walking, or is tilted or leaned on the Lantern tab. Off: the lamp turns with the pole, as in the game.
# Setting type: Boolean
