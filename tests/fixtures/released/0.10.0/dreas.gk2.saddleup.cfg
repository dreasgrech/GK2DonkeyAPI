## Settings file was created by plugin GK2 Saddle Up v0.10.0
## Plugin GUID: dreas.gk2.saddleup
#
# Captured from the release zip's own run (checklist section 5, 2026-10-19 15:45: GK2-Saddle-Up-0.10.0.zip with the dev
# tools locked, over the 0.9.1 fixture cfgs), so the sections, keys and comments are what 0.10.0 wrote for a player.
# The keys new in 0.10.0 (FoalsWearSkin, the Effect rows, the six *Lightness keys) were then set to values other than
# their defaults, so the upgrade self-test sees a value that got lost. Mount and Skin_donkey can only be "donkey" in
# 0.10.0 (its mounts are off). Keep this file as it is: it is what a player who installed 0.10.0 has on disk.

[1. Keys]

## Your mount comes and you ride it (a parked cart stays where it is); again: dismount. In the cart: leave the cart standing and ride on.
# Setting type: KeyboardShortcut
# Default value: H
RideKey = R

## Your mount comes with its cart and you drive; again: dismount. Riding: the cart comes and is hitched.
# Setting type: KeyboardShortcut
# Default value: G
CartKey = T

## While mounted. None = no key.
# Setting type: KeyboardShortcut
# Default value: B
BellKey = N

## Your mount, its cart and its babies go (the cart's load is set down first); the next key brings a new one. None = no key.
# Setting type: KeyboardShortcut
# Default value: 
SendAwayKey = F6

[2. Mount]

## Shown when you walk up to it: "[E] Ride Bella". Empty: no name.
# Setting type: String
# Default value: 
Name = Bella

## What you ride. The donkey, in this version; other mounts (the dragon, the giant rat, ...) come in the next update.
# Setting type: String
# Default value: donkey
Mount = donkey

## How the donkey is drawn. As the game draws it, in this version; skins (Hellfire, skin packs) come in the next update.
# Setting type: String
# Default value: donkey
Skin_donkey = donkey

## Little ones of your mount that stay with it and follow it around.
# Setting type: Int32
# Default value: 0
# Acceptable value range: From 0 to 5
Foals = 3

## They come through doors with you into buildings, the church and dungeons, follow you inside and come back out with you.
# Setting type: Boolean
# Default value: true
FoalsIndoors = false

## Off: they stay plain baby donkeys whatever yours is.
# Setting type: Boolean
# Default value: true
FoalsWearSkin = false

[3. Effect]

## A particle effect on your mount. None in this version (the donkey comes with none); Hellfire and effects from mods come in the next update.
# Setting type: String
# Default value: mount
Effect = 

# Setting type: MountEffectWhen
# Default value: Always
# Acceptable values: Off, Night, Always
EffectWhen = Night

## Hellfire: flames left behind while it walks, burning out.
# Setting type: Boolean
# Default value: true
EffectTrail = false

## With the cart hitched, one wider ring round the mount and the cart.
# Setting type: Boolean
# Default value: false
EffectWithCart = true

## Off: it goes out while you fight in armour.
# Setting type: Boolean
# Default value: true
EffectInFights = false

## A smaller one round each of your mount's babies.
# Setting type: Boolean
# Default value: false
EffectOnFoals = true

[4. Behaviour]

## How fast you go riding your mount.
# Setting type: MountSpeed
# Default value: Normal
# Acceptable values: Normal, Faster, Fastest
RideSpeed = Fastest

## How fast you go driving the cart.
# Setting type: MountSpeed
# Default value: Normal
# Acceptable values: Normal, Faster, Fastest
CartSpeed = Faster

## The keeper's thought bubble.
# Setting type: Boolean
# Default value: true
ShowMessages = false

## Pick up a zombie while driving and it lies on the cart, as many as the cart holds; hand it to its work straight from the cart. Off: the cart refuses zombies.
# Setting type: Boolean
# Default value: true
CargoZombies = false

## Driving the cart through the morgue door with a corpse on it: you get off at the door as always and the cart stays outside with its load, but you walk in carrying the corpse. Off: it stays on the cart.
# Setting type: Boolean
# Default value: true
CorpseIntoMorgue = false

## Drive up to a plain storage chest (rough, normal or good) and press the action key: it rides on the cart with everything inside, alone. The interact key with nothing in front sets it down. Off: chests stay where they are.
# Setting type: Boolean
# Default value: true
CargoChest = false

## How many items the cart carries: 6 (three layers of two), 4 (two layers) or 2 like the game's own delivery cart. Piles, tables and stations take from all of them; a chest aboard still takes the whole cart. Lowering it never drops anything: a fuller cart stays full until unloaded.
# Setting type: Int32
# Default value: 6
# Acceptable value range: From 2 to 6
CartSlots = 4

## Left without its cart, it takes a few slow steps now and then.
# Setting type: Boolean
# Default value: true
IdleShuffle = false

## After loading, your mount and cart are where you left them, the load on the cart. They're kept in a small file next to each save (<save>.gk2donkeyapi.dat), which Steam Cloud syncs along with your saves.
# Setting type: Boolean
# Default value: true
KeepWithSaves = true

## Ride key while your mount stands somewhere with the cart: it comes alone and the cart stays where you left it, with its load. Off: both come and the cart is left standing next to you.
# Setting type: Boolean
# Default value: true
CartStaysParked = false

## The game's delivery donkey leaves the bodies it brings at the crossroads by the nun, where it appears, instead of putting them on the morgue pallets. You carry them to the morgue yourself, or cart them. Off: the game's own delivery.
# Setting type: Boolean
# Default value: false
CorpsesAtCrossroads = true

