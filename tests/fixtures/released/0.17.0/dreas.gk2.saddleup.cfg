[4. Cart]

## Zombies you pick up while driving lie on the cart. You can hand them to their work from there.
# Setting type: Boolean
# Default value: true
CargoZombies = false

## Drive up to a storage chest and press the Work key to load it with everything inside. Press the Interact key with nothing in front of you to set it down.
# Setting type: Boolean
# Default value: true
CargoChest = false

## Drive through the morgue door with a corpse on the cart and you walk in carrying it. The cart waits outside.
# Setting type: Boolean
# Default value: true
CorpseIntoMorgue = false

## The game's delivery donkey leaves new bodies at the crossroads instead of in front of the morgue. You bring them in yourself.
# Setting type: Boolean
# Default value: false
CorpsesAtCrossroads = true

[5. Safe spot]

## If you fall out of the world, you are put back on the last ground you stood on.
# Setting type: Boolean
# Default value: true
FallGuard = false

## Puts you back on the last ground you stood on. Use it if you get stuck.
# Setting type: KeyboardShortcut
# Default value: 
ReturnKey = KeypadPlus

[6. Freeplay]

## Every mount that pulls a cart carries 6 items, whatever its own cargo.
# Setting type: Boolean
# Default value: false
MaxCargo = true

## Every mount, the donkey too, goes at the speed you pick below. With the cart it is slower, as always.
# Setting type: Boolean
# Default value: false
SameSpeed = true

## Normal is the donkey's speed.
# Setting type: SpeedBand
# Default value: Normal
# Acceptable values: VerySlow, Slow, Normal, Fast, VeryFast
Speed = Fast

