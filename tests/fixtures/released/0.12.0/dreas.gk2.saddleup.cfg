## Fixture: written by the 0.12.0 / API 0.40.0 release zip's first run (rehearsal 2026-10-27), then every value set off its default (docs/compatibility.md 4).
## Settings file was created by plugin GK2 Saddle Up v0.12.0
## Plugin GUID: dreas.gk2.saddleup

[1. Keys]

## Your mount comes and you ride it (a parked cart stays where it is); again: dismount. In the cart: leave the cart standing and ride on.
# Setting type: KeyboardShortcut
# Default value: H
RideKey = Keypad1

## Your mount comes with its cart and you drive; again: dismount. Riding: the cart comes and is hitched.
# Setting type: KeyboardShortcut
# Default value: G
CartKey = Keypad2

## While mounted. None = no key.
# Setting type: KeyboardShortcut
# Default value: B
BellKey = Keypad3

## While mounted, your mount calls out: the donkey brays, the dragon roars, the rat squeaks, Gerry talks; its babies answer. The snail and the worm are silent. None = no key.
# Setting type: KeyboardShortcut
# Default value: V
CallOutKey = Keypad4

## Your mount, its cart and its babies go (the cart's load is set down first); the next key brings a new one. None = no key.
# Setting type: KeyboardShortcut
# Default value: 
SendAwayKey = Keypad5

## Riding, your mount jumps: hold the key for a higher jump. Over what is lower than the jump. Not in a fight, where Space attacks. None = no jumping.
# Setting type: KeyboardShortcut
# Default value: Space
JumpKey = Keypad6

## Riding a mount that flies, outdoors: take off, and land again. The same key as Jump: jump, then press again in the air to take off. None = no flying.
# Setting type: KeyboardShortcut
# Default value: Space
FlyKey = Keypad7

## Flying: hold it to climb, up to the flight's highest. The key alone counts (a modifier can be it; the game's Settings window can't set a lone modifier, the Mods menu and the cfg can). None = no climbing.
# Setting type: KeyboardShortcut
# Default value: LeftShift
ClimbKey = Keypad8

## Flying: hold it to come down; at the ground you have landed. The key alone counts. None = the Fly key lands.
# Setting type: KeyboardShortcut
# Default value: LeftControl
DescendKey = Keypad9

## Stuck, or fallen somewhere you shouldn't be: puts you back on the last ground you stood on in this scene. None = no key (the Behaviour section has a button).
# Setting type: KeyboardShortcut
# Default value: 
ReturnKey = Keypad0

## Opens the Mounts panel over the game: every mount you can ride, the chosen one drawn with what it is and does, its skins and colours. None = no key (the Mount section's button opens it too).
# Setting type: KeyboardShortcut
# Default value: 
MountsKey = KeypadPlus

