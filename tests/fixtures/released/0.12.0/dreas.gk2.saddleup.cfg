[4. Behaviour]

## The keeper's thought bubble.
# Setting type: Boolean
# Default value: true
ShowMessages = false

## Left without its cart, it takes a few slow steps now and then.
# Setting type: Boolean
# Default value: true
IdleShuffle = false

## Ride into houses, the church and the morgue, and get on inside. A door with a loading screen still ends the ride. Off: you get off at the door and can't mount inside.
# Setting type: Boolean
# Default value: false
MountIndoors = true

## With mounting indoors allowed: the cart comes inside too (it can get caught on furniture and door frames). Off: driving the cart through a door, the cart stays at the door with its load and you ride on inside (at the morgue you get off inside carrying the corpse, your mount with you); inside you can ride, not drive.
# Setting type: Boolean
# Default value: false
CartIndoors = true

## If you ever end up under the ground, falling into nothing or far below the world, you are put back on the last ground you stood on (the log says why). Never during a door, a cutscene or a dialogue; standing under a bridge is fine.
# Setting type: Boolean
# Default value: true
FallGuard = false

[5. Cart]

## How many items the cart carries: 6 (three layers of two), 4 (two layers) or 2 like the game's own delivery cart. A mount that carries less pulls less (the giant rat 2, Gerry and the giant worm 4; the Mounts panel shows each one's cargo). Piles, tables and stations take from all of them; a chest aboard still takes the whole cart. Lowering it never drops anything: a fuller cart stays full until unloaded.
# Setting type: Int32
# Default value: 6
# Acceptable value range: From 2 to 6
CartSlots = 2

## Pick up a zombie while driving and it lies on the cart, as many as the cart holds; hand it to its work straight from the cart. Off: the cart refuses zombies.
# Setting type: Boolean
# Default value: true
CargoZombies = false

## Drive up to a plain storage chest (rough, normal or good) and press the action key: it rides on the cart with everything inside, alone. The interact key with nothing in front sets it down. Off: chests stay where they are.
# Setting type: Boolean
# Default value: true
CargoChest = false

## Driving the cart through the morgue door with a corpse on it: you get off at the door as always and the cart stays outside with its load, but you walk in carrying the corpse (riding indoors allowed and the cart not: your mount comes in with you). Off: it stays on the cart.
# Setting type: Boolean
# Default value: true
CorpseIntoMorgue = false

## The game's delivery donkey leaves the bodies it brings at the crossroads by the nun, where it appears, instead of putting them on the morgue pallets. You carry them to the morgue yourself, or cart them. Off: the game's own delivery.
# Setting type: Boolean
# Default value: false
CorpsesAtCrossroads = true

## Ride key while your mount stands somewhere with the cart: it comes alone and the cart stays where you left it, with its load. Off: both come and the cart is left standing next to you.
# Setting type: Boolean
# Default value: true
CartStaysParked = false

[6. Sound]

## When the cart sets off with a load after standing.
# Setting type: Boolean
# Default value: false
Bell = true

## Now and then, and when you get on.
# Setting type: Boolean
# Default value: true
Brays = false

## Parked mounts and babies near you make their sounds: steps, grazing, the lip smack, a call now and then, the babies answering their parent. Off: only the mount you ride.
# Setting type: Boolean
# Default value: true
StandingSounds = false

