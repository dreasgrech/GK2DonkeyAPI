## ## Fixture: written by the 0.12.0 / API 0.40.0 release zip's first run (rehearsal 2026-10-27 15:50), then every value set off its default (tools/fixture-flip.py; docs/compatibility.md 4).
## Settings file was created by plugin GK2 Saddle Up v0.12.0
## Plugin GUID: dreas.gk2.saddleup

[1. Keys]

## Opens the Mounts panel. Pick your mount there and set its name, skin, babies and colours.
# Setting type: KeyboardShortcut
# Default value: L
MountsKey = Keypad1

## Calls your mount and gets you on. Press it again to get off. In the cart, it leaves the cart standing and you ride on.
# Setting type: KeyboardShortcut
# Default value: H
RideKey = Keypad2

## Calls your mount with its cart so you can drive. Press it again to get off. While riding, it brings the cart.
# Setting type: KeyboardShortcut
# Default value: G
CartKey = Keypad3

## Rings the bell while you drive the cart.
# Setting type: KeyboardShortcut
# Default value: B
BellKey = Keypad4

## Your mount calls out while you ride, and its babies answer.
# Setting type: KeyboardShortcut
# Default value: V
CallOutKey = Keypad5

## Sends your mount, its cart and its babies away. The cart's load is put down first.
# Setting type: KeyboardShortcut
# Default value: 
SendAwayKey = Keypad6

## Your mount jumps while you ride. Hold the key to jump higher. In a fight, Space attacks instead, so set another key if you want to jump while fighting.
# Setting type: KeyboardShortcut
# Default value: Space
JumpKey = Keypad7

## Takes off on a mount that can fly. Press it again while flying to land. If it shares the Jump key, jump first and press it in the air to take off. In a fight, Space attacks instead.
# Setting type: KeyboardShortcut
# Default value: Space
FlyKey = Keypad8

## Hold it while flying to go up.
# Setting type: KeyboardShortcut
# Default value: LeftShift
ClimbKey = Keypad9

## Hold it while flying to go down. You land when you reach the ground.
# Setting type: KeyboardShortcut
# Default value: LeftControl
DescendKey = Keypad0

