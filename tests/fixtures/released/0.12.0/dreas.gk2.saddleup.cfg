[4. Mount Behaviour]

## The keeper says why in a thought bubble.
# Setting type: Boolean
# Default value: true
ShowMessages = false

## Your mount takes a few slow steps now and then while it waits without its cart.
# Setting type: Boolean
# Default value: true
IdleShuffle = false

## Ride into houses, the church and the morgue. Doors with a loading screen still end the ride.
# Setting type: Boolean
# Default value: false
MountIndoors = true

## The cart comes inside too, but it can get stuck on furniture. When this is off, the cart waits at the door.
# Setting type: Boolean
# Default value: false
CartIndoors = true

[5. Cart]

## Zombies you pick up while driving lie on the cart. You can hand them to their work from there.
# Setting type: Boolean
# Default value: true
CargoZombies = false

## Drive up to a storage chest and press the action key to load it with everything inside. Press interact with nothing in front of you to set it down.
# Setting type: Boolean
# Default value: true
CargoChest = false

## Drive through the morgue door with a corpse on the cart and you walk in carrying it. The cart waits outside.
# Setting type: Boolean
# Default value: true
CorpseIntoMorgue = false

## The game's delivery donkey leaves new bodies at the crossroads instead of in front of the morgue. You bring them in yourself.
# Setting type: Boolean
# Default value: false
CorpsesAtCrossroads = true

[6. Sound]

## Your mount calls out now and then, and when you get on.
# Setting type: Boolean
# Default value: true
Brays = false

## Parked mounts and babies near you make their sounds too. When this is off, you only hear the mount you ride.
# Setting type: Boolean
# Default value: true
StandingSounds = false

[7. Safe spot]

## If you fall out of the world, you are put back on the last ground you stood on.
# Setting type: Boolean
# Default value: true
FallGuard = false

## Puts you back on the last ground you stood on. Use it if you get stuck.
# Setting type: KeyboardShortcut
# Default value: 
ReturnKey = KeypadPlus

[8. Freeplay]

## Every mount that pulls a cart carries 6 items, whatever its own cargo.
# Setting type: Boolean
# Default value: false
MaxCargo = true

## Every mount, the donkey too, goes at the speed you pick below. With the cart it is slower, as always.
# Setting type: Boolean
# Default value: false
SameSpeed = true

## Normal is the donkey's speed.
# Setting type: SpeedBand
# Default value: Normal
# Acceptable values: VerySlow, Slow, Normal, Fast, VeryFast
Speed = Fast

