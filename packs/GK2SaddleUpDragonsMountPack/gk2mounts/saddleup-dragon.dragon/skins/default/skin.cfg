# A skin of GK2 Saddle Up's dragon mount (docs/skins.md): its look, the mount's own values in ..\..\mount.cfg. Drawn by tools/skins/creatures/make_creatures.py: our own art.
[Skin]
format = 1
name = Red Dragon
description = Red scales, a spiked tail and a golden belly. The wings are mostly for show. And for flying.
author = dreas
version = 1.0
base = donkey
colours = own
layer = replace
canvas = 128 128
seat = 62  # the rider's hip on this row (the donkey's 52, plus the 16 px the 128 canvas adds, minus the 6 px the body stands higher on its longer legs since 2026-10-23), every frame, for every player

# A part of its own: the horns and the back spikes, the bone golds (docs/mount-colours.md 7.11; they were the Dark
# row's with the outline). Its outline is its Dark, which no [Region.Dark] names, so it has no row: the line art.
[Tone.horns]
name = Horns and spikes
colours = 52402E 928062 D4C6A8

# The parts the colours window names, this mount's own words for them (docs/second-tone.md 8): a region not named
# here has no row of its own (its outline alone, the line art).
[Region.Coat]
name = Scales and wings

[Region.Muzzle]
name = Belly

[Region.Eye]
name = Eyes and claws

# The skin's colours by mount region (docs/mount-colours.md); every colour not named is Coat.
[Colors]
Dark = 1C060C 2E0C14 1E0A0A
Muzzle = 703E1A A86A28 DAA042
Eye = F4CE76 FAD640
