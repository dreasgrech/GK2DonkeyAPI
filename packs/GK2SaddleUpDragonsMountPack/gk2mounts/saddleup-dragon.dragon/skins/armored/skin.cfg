# The Armored Dragon (2026-11-07, docs/dragon-references.md): a skin of the dragon drawn by
# tools/skins/creatures/make_creatures.py armored-dragon. Built on the dragon's default (its canvas, seat and tuning);
# every picture its own. Our own art; its steel is the game knight's.
[Skin]
format = 1
name = Armored Dragon
description = A war dragon in plate: a closed helm trimmed in gold, steel down its neck and flanks, and blackened steel wings pierced through.
author = dreas
version = 1.0

# Every part its own (docs/mount-colours.md 7.10): the steel (its wings are steel plates too), its gold and the horns.
[Tone.armour]
name = Armour
colours = 1E3737 32443F 565B4E 6A7062 7A8778 9AB5A6 C1E6D9 192C2D

[Tone.gold]
name = Gold trim
colours = A4800B CFA90F F1D274

[Tone.horns]
name = Horns and claws
colours = 302A32 5A545E

[Region.Coat]
name = Scales

[Region.Muzzle]
name = Belly

[Region.Eye]
name = Eyes

# The colours by region; every colour not named is Coat (the scales). The outline is Dark, with no row: the line art.
[Colors]
Dark = 0E0A16 08060E
Muzzle = 46301C 6E4E2A
Eye = F06030
