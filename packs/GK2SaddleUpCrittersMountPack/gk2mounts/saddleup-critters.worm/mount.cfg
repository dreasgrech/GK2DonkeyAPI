# A mount of the pack GK2SaddleUpCrittersMountPack, an external pack of GK2 Saddle Up (packs/, docs/making-a-mount.md): what the
# player rides, shared by every skin in skins\.
# The [Mount] facts, its [Stats], its [Tuning] and its [Sounds] (files in sounds\, docs/mount-sounds.md).
[Mount]
needs = 0.40
id = saddleup-critters.worm
name = Worm
description = It came up out of the cemetery one rainy night and decided to stay. Best not to ask what it was eating down there.
author = dreas
version = 1.0
cart = true
foals = true
speed = Slow  # one of the API's speeds: Very slow, Slow, Normal (the donkey), Fast, Very fast
cargo = 4  # items its cart carries, 1 to 6 (the player's Cart capacity, when smaller, wins)

# The worm's own sounds (docs/mount-sounds.md), first picks to audition: a rustle as the body drags, dirt at the
# mouth, a wet slap getting on and off (the donkey's own sounds never reach another mount).
[Sounds]
voice = none
step = bush_chop  # the body dragging: a rustle, twice a cycle
step.volume = 0.5
step.per_cycle = 2
graze = tool_shovel  # dirt
graze.volume = 0.5
lips = none
mount = spitter_hit  # a wet slap
dismount = spitter_hit
