# A mount of the pack SaddleUpDragon, an external pack of GK2 Saddle Up (packs/, docs/making-a-mount.md): what the
# player rides, shared by every skin in skins\.
# The [Mount] facts, its [Stats], its [Tuning] and its [Sounds] (files in sounds\, docs/mount-sounds.md).
[Mount]
needs = 0.40
id = saddleup-dragon.dragon
name = Dragon
description = Nobody knows where it came from, and it isn't saying. It won't pull a cart, but no fence, river or roof in the village can stop it.
author = dreas
version = 1.0
cart = false  # no cart behind a dragon (the user, 2026-10-25): it is ridden plain
foals = true
flies = true
speed = 1.6  # times the keeper's walking speed, riding (the donkey: 2)

# The dragon's own jump (docs/flying.md "Each mount its own jump"; the user, 2026-10-25: the donkey's arc made it "a
# plompling rock ... something akin to takeoff and landing"): a slow crouch, a push-off on its wings, a hang, a braked
# sink onto the ground; its take-off and landing frames all the way (wings). A first pass, to judge in game.
[Jump]
height = 36  # the donkey: 28
tap_height = 24
time = 1  # seconds in the air (the donkey: 0.45)
rise_share = 0.45  # a quicker push up than the sink down
hang = 0.12
crouch = 4
crouch_time = 0.15  # gathering itself before the push-off
squash = 3
fall_ease = 0.8  # the wings brake the fall: a soft touch-down, not a drop
wings = true

# The dragon's own sounds (docs/mount-sounds.md; files in sounds\, trimmed and levelled): the user's growls for its
# roar, getting on and off and its babies (pitched up), take-off, landing, flaps, glide and the landing thud; heavy
# stone steps and a bellows breath at the grass from the game's own.
[Sounds]
voice = voice_1.ogg, voice_2.ogg, voice_3.ogg  # the user's growls (2026-10-25), in place of the zombie's cry pitched down
voice.idle_every = 60
voice.volume = 0.33  # matched to the game's own sounds (the donkey's bray / lip smack; GK2-mount-sounds\loudness.txt, 2026-10-25)
mount = voice_1.ogg  # the shortest growl as the keeper gets on
mount.volume = 0.43  # matched to the game's own sounds (the donkey's bray / lip smack; GK2-mount-sounds\loudness.txt, 2026-10-25)
dismount = voice_1.ogg
dismount.volume = 0.43  # matched to the game's own sounds (the donkey's bray / lip smack; GK2-mount-sounds\loudness.txt, 2026-10-25)
takeoff = takeoff_1.ogg, takeoff_2.ogg, takeoff_3.ogg, takeoff_4.ogg  # the user's lift-off sounds (2026-10-24), trimmed and levelled
takeoff.volume = 0.33  # matched to the game's own sounds (the donkey's bray / lip smack; GK2-mount-sounds\loudness.txt, 2026-10-25)
land = land_1.ogg, land_2.ogg  # the user's landing sounds: from the start of the dive, about two seconds to the ground
land.volume = 0.33  # matched to the game's own sounds (the donkey's bray / lip smack; GK2-mount-sounds\loudness.txt, 2026-10-25)
touchdown = touchdown_1.ogg  # the user's landing thud (2026-10-25), on touching the ground
touchdown.volume = 0.33  # matched to the game's own sounds (the donkey's bray / lip smack; GK2-mount-sounds\loudness.txt, 2026-10-25)
flap = flap_1.ogg, flap_2.ogg, flap_3.ogg, flap_4.ogg, flap_5.ogg  # the user's flapping, cut into single wing beats (one a beat, 0.6 s)
flap.volume = 0.2  # matched to the game's own sounds (the donkey's bray / lip smack; GK2-mount-sounds\loudness.txt, 2026-10-25)
glide = glide_1.ogg, land_2.ogg  # the user's glide sounds (the second is also a landing); cut when the glide ends
glide.volume = 0.33  # matched to the game's own sounds (the donkey's bray / lip smack; GK2-mount-sounds\loudness.txt, 2026-10-25)
step = step_stone  # heavy feet: the stone step, low and loud, one on each paw's landing (frames 1, 3, 5, 7)
step.pitch = 0.7
step.volume = 1.6
step.per_cycle = 4
graze = conveyor_furnace_bellows  # a breath at the grass
graze.volume = 0.8
lips = none

# The babies answer their parent's roar with the same growls, pitched up and softer: a whelp's.
[Sounds.Baby]
answer = voice_1.ogg, voice_2.ogg
answer.pitch = 1.2  # a small growl, not a chirp (x the babies' size, about 1.7 in all)
answer.volume = 1  # at the parent's call as heard (the trace of 2026-10-25: 6 dB under it plus the babies' distance was 10 dB, never heard)
