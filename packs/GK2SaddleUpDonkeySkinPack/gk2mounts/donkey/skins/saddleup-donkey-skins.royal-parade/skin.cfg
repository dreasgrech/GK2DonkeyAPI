# Royal Parade: a saddle cloth and a crown worn over the donkey (docs/sprite-tools.md): our own art, generated by
# tools/skins/royal-parade/make_royal.py from the donkey's frames (a PNG per frame next to this file is its output).
[Skin]
format = 1
name = Royal Parade
description = A crown and a royal saddle cloth, fit for a coronation or at least a good funeral. The cloth follows your harness colour.
author = dreas
version = 0.1
base = donkey
colours = own
layer = over
canvas = 96 96

# The cloth's reds under Harness: how an API without tones reads them (the player's harness colour on the cloth, as
# before the tones); this one moves them to the saddle cloth's tone below (docs/mount-colours.md 7.9).
[Colors]
Harness = E23A50 C41E38 96122C 3A0A12

# The saddle cloth: its first choice follows the harness colour, so a player's look stays as it was; any other colour
# gives the cloth its own.
[Tone.cloth]
name = Saddle cloth
follows = Harness
colours = E23A50 C41E38 96122C 3A0A12

# The cloth's trim (its border, the hem's band and the fringe), the cloth's emblem, the crown and the crown's jewels,
# every part its own, each as drawn until given a colour. The three golds are one gold to the eye, each part's shades
# its own (tools/skins/part_palette.py, make_royal.py): a colour is one part's only.
# The rows come largest part first, a part that sits on another right after it (2026-11-08, the user: "descending
# order of the largest, most visible part"): the cloth with its trim and emblem, then the crown with its jewels
# (tools/skins/row_sizes.py).
[Tone.trim]
name = Trim and fringe
colours = 996414 E3A82F FED653

[Tone.emblem]
name = Emblem
colours = E2A92F FFDA52

[Tone.crown]
name = Crown
colours = 966414 E2A830 FFD652

[Tone.jewels]
name = Jewels
colours = DC143C 3C6EE6
