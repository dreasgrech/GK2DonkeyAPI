# Armored: plate barding drawn OVER the donkey (docs/skins.md): an armet (a closed helmet: a round skull, a gilt
# brow, the sight, a beaked visor on a brass rosette, a roped gilt rim) with a plume, a chest plate, steel lames, a
# rump plate, a cloth skirt and a steel guard on the tail; ears, tail and legs stay the donkey's. Generated by
# tools/skins/armored/make_armored.py (the pictures hold only our pixels; the few the donkey's head pokes past the
# helm in five frames are erased, FF00FF).
# Our own art; nothing of the game's.
[Skin]
format = 1
name = Armored
description = Plate barding with a plumed knight's helmet, steel lames, a cloth skirt and a steel tail guard. The skirt and the plume follow your second tone.
author = dreas
version = 1.0
base = donkey
colours = own
layer = over
canvas = 96 96

# The skirt and the plume follow the Second tone (the Muzzle row), so the harness colour reaches only the donkey's own
# harness (the user, 2026-11-02: under Harness the cloth took the harness colour and the Second tone did nothing on this
# skin). Under Muzzle here for an API without tones; this one moves them to the skirt's and the plume's tones below
# (docs/mount-colours.md 7.9).
[Colors]
Muzzle = 38121A 5E1C24 8A282A B23A32 381218 5F1C23 892829 B13A31 D25C46

# Every part its own (the user, 2026-11-04: "every part is named and is able to be coloured"). The helmet and the
# body armour, the plume and the skirt: one steel and one cloth to the eye, each part's shades its own (a colour
# is one tone's only). The steel's outline 281B26 is the drawing's line and stays as drawn.
[Tone.helmet]
name = Helmet
colours = 393131 473D3F 5F5357 6F666F 837788 9D92A5 B0ACB0 CCC9CE

# The plume and the skirt: the first choice follows the Second tone, as before; any other colour gives them their own.
[Tone.plume]
name = Plume
follows = Muzzle
colours = 381218 5F1C23 892829 B13A31 D25C46

[Tone.armour]
name = Body armour
colours = 393134 483E3F 5D5357 706670 837988 9D92A3 B1ACB1

[Tone.skirt]
name = Skirt
follows = Muzzle
colours = 38121A 5E1C24 8A282A B23A32

[Tone.brass]
name = Brass
colours = 7D5308 A4800B CFA90F F1D274
