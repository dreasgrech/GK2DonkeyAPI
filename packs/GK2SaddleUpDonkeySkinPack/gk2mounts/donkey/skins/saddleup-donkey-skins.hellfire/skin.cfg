# Hellfire: horns where the ears were, a devil's tail where the tail was, eyes that glow, lava cracks across an ash
# coat: a skin drawn OVER the donkey (docs/skins.md). Generated by tools/skins/hellfire/make_hellfire.py from the
# reviewed prototype: the pictures hold only our pixels and the erase marks (magenta) that take the ears and the
# tail off the donkey; the ash coat is the [Base.Coat] recolour below. Our own art; nothing of the game's.
[Skin]
format = 1
name = Hellfire
description = Horns, a devil's tail, glowing eyes and lava cracks over an ash coat. The bishop does not approve.
author = dreas
version = 2.0
base = donkey
colours = own
layer = over
erase = FF00FF
canvas = 96 96

# The cracks follow the player's muzzle colour, the horns and the tail's dark its dark parts, the glow its eye
# colour, as the recipe had it; everything else is kept as drawn. Here for an API without tones; this one moves them
# to the tones below, every part its own, whose first choice follows the same regions (docs/mount-colours.md 7.9).
# The outline is the drawing's line, in no region, so no colour row reaches it, as the donkey's own (7.11).
[Colors]
Muzzle = FF9628 FF5A18 96220C
Dark = ECDCB4 C8B082 785A3C 2C1210 461A14
Eye = FFAA28 DC3C14 C8281E 781410

[Tone.horns]
name = Horns
follows = Dark
colours = ECDCB4 C8B082 785A3C

[Tone.glow]
name = Glowing eyes
follows = Eye
colours = FFAA28 DC3C14

[Tone.lava]
name = Lava cracks
follows = Muzzle
colours = FF9628 FF5A18 96220C

[Tone.tail]
name = Tail
follows = Dark
colours = 2C1210 461A14

[Tone.tail-tip]
name = Tail tip
follows = Eye
colours = C8281E 781410

# The donkey's dark parts under the skin: its legs and mane, its ears gone under the horns (docs/second-tone.md 8).
[Region.Dark]
name = Legs and mane

# The ash coat: the donkey's coat under the skin, darkened and warmed (the prototype's darken_coat), before the
# player's own coat colour.
[Base.Coat]
Brightness = 0.41
Saturation = 1
Colorize = FF4747
ColorizeAmount = 0.6
