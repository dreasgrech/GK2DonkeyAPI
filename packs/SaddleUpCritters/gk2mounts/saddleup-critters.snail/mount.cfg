# A mount of the pack SaddleUpCritters, an external pack of GK2 Saddle Up (packs/, docs/making-a-mount.md): what the
# player rides, shared by every skin in skins\.
# The [Mount] facts, its [Stats], its [Tuning] and its [Sounds] (files in sounds\, docs/mount-sounds.md).
[Mount]
needs = 0.40
id = saddleup-critters.snail
name = Snail
description = It takes its time. All of it. Whatever you load arrives eventually, and it leaves a shiny trail to find your way back.
author = dreas
version = 1.0
cart = true
foals = true
speed = 1.25  # times the keeper's walking speed, riding (the donkey: 2)
cargo = 6  # items its cart carries, 1 to 6 (the player's Cart capacity, when smaller, wins)

# The snail's own sounds (docs/mount-sounds.md): no voice; a wet squelch as it slides and when the keeper gets on and off (the
# user's slime recording of 2026-10-25, in sounds\; sharp, so turned up), and a small squelch for its babies (the
# donkey's own sounds never reach another mount; these lines say so in the file).
[Sounds]
voice = none
step = step_1.ogg, step_2.ogg, step_3.ogg  # a wet squelch as it slides along (the user, 2026-10-25: "sound those slime sounds while walking")
step.volume = 0.03  # x the footsteps' base 3: the donkey's hoof on grass (GK2-mount-sounds\loudness.txt)
step.pitch = 1.25  # cancels the footsteps' base 0.8: the squelch as recorded
step.pitch_variation = 0.1
step.per_cycle = 2
graze = none
lips = none
mount = mount_1.ogg  # wet, in place of the fishing blop
mount.volume = 0.63  # matched to the game's own sounds (the donkey's bray / lip smack; GK2-mount-sounds\loudness.txt, 2026-10-25)
dismount = dismount_1.ogg
dismount.volume = 0.68  # matched to the game's own sounds (the donkey's bray / lip smack; GK2-mount-sounds\loudness.txt, 2026-10-25)

# The babies answer (only to a call a mod makes: the snail itself never calls) with a small squelch, pitched up.
[Sounds.Baby]
answer = answer_1.ogg
answer.pitch = 1.4
answer.volume = 2.5  # at the parent's call as heard (the trace of 2026-10-25: 6 dB under it plus the babies' distance was 10 dB, never heard)
