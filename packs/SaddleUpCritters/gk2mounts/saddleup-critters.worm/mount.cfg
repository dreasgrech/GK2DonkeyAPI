# A mount of the pack SaddleUpCritters, an external pack of GK2 Saddle Up (packs/, docs/making-a-mount.md): what the
# player rides, shared by every skin in skins\.
# The [Mount] facts, its [Stats], its [Tuning] and its [Sounds] (files in sounds\, docs/mount-sounds.md).
[Mount]
needs = 0.40
id = saddleup-critters.worm
name = Giant Worm
description = A giant worm: it pulls the cart, has young and makes no sound; nothing on it takes a harness or a second tone.
author = dreas
version = 1.0
cart = true
foals = true
speed = 1.75  # times the keeper's walking speed, riding (the donkey: 2)
cargo = 6  # items its cart carries, 1 to 6 (every mount the most for now)

# The worm's own sounds (docs/mount-sounds.md), first picks to audition: a rustle as the body drags, dirt at the
# mouth, a wet slap getting on and off (the donkey's own sounds never reach another mount).
[Sounds]
voice = none
step = bush_chop  # the body dragging: a rustle, twice a cycle
step.volume = 0.5
step.per_cycle = 2
graze = tool_shovel  # dirt
graze.volume = 0.5
lips = none
mount = spitter_hit  # a wet slap
dismount = spitter_hit
