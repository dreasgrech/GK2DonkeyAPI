# A mount of the pack SaddleUpCritters, an external pack of GK2 Saddle Up (packs/, docs/making-a-mount.md): what the
# player rides, shared by every skin in skins\.
# The [Mount] facts, its [Stats], its [Tuning] and its [Sounds] (files in sounds\, docs/mount-sounds.md).
[Mount]
needs = 0.40
id = saddleup-critters.rat
name = Rat
description = Grew fat on the morgue's leftovers and never stopped growing. The fastest thing on four legs, as long as you don't ask it to carry much.
author = dreas
version = 1.0
cart = true
foals = true
speed = 2.75  # times the keeper's walking speed, riding (the donkey: 2)
cargo = 2  # items its cart carries, 1 to 6 (the player's Cart capacity, when smaller, wins)

# The rat's own sounds (docs/mount-sounds.md; files in sounds\, the user's squeaks of 2026-10-25, trimmed and
# levelled): squeaks for its call, getting on and off and its babies' answer; quick light feet and nibbling from the
# game's own.
[Sounds]
voice = voice_1.ogg, voice_2.ogg, voice_3.ogg  # the user's squeaks (the second a chatter), in place of the spitter's cry pitched up
voice.volume = 0.19  # matched to the game's own sounds (the donkey's bray / lip smack; GK2-mount-sounds\loudness.txt, 2026-10-25)
voice.idle_every = 30
mount = mount_1.ogg  # a short squeak as the keeper gets on
mount.volume = 0.29  # matched to the game's own sounds (the donkey's bray / lip smack; GK2-mount-sounds\loudness.txt, 2026-10-25)
dismount = dismount_1.ogg
dismount.volume = 0.29  # matched to the game's own sounds (the donkey's bray / lip smack; GK2-mount-sounds\loudness.txt, 2026-10-25)
step = ground  # the ground's own step sound, high and light, six quick feet a cycle
step.pitch = 1.4
step.volume = 0.7
step.per_cycle = 6
graze = item_use_food  # nibbling
graze.volume = 0.8
lips = none

# The babies answer with two small squeaks, pitched up.
[Sounds.Baby]
answer = answer_1.ogg, answer_2.ogg
answer.pitch = 1.3
answer.volume = 0.93  # at the parent's call as heard (the trace of 2026-10-25: 6 dB under it plus the babies' distance was 10 dB, never heard)
